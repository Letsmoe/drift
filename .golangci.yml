version: '2'

run:
  timeout: 3m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gocognit
    - misspell
    - nestif
    - noctx
    - revive
    - unconvert
    - unparam
    - wrapcheck
  settings:
    gocognit:
      min-complexity: 15
    nestif:
      min-complexity: 4
    revive:
      rules:
        - name: exported
        - name: var-naming
        - name: early-return
        - name: indent-error-flow
        - name: unused-parameter
    wrapcheck:
      ignore-package-globs:
        - github.com/neoworks/otter-music/*

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/neoworks/otter-music
