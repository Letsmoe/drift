[package]
name = "drift"
version = "0.0.1"
edition = "2024"
description = "The Drift desktop shell: starts the Go backend, plays audio with GStreamer and runs the svelte-gpui UI."

[dependencies]
# The svelte-gpui checkout sits next to the drift checkout; a worktree reaches it through .worktrees/svelte-gpui.
svelte_gpui_host = { path = "../../../../svelte-gpui/host" }
serde_json = "1"
gstreamer = "0.25"
serde = { version = "1", features = ["derive"] }
# MPRIS (media keys, desktop widgets, playerctl) over the session D-Bus.
mpris-server = "0.11"

[features]
# Set by scripts/package.mjs of svelte-gpui: runs the bundle packed into the binary instead of a --bundle file.
package = []

[patch.crates-io]
xattr = { path = "../../../../svelte-gpui/host/vendor/xattr" }
gpui = { path = "../../../../svelte-gpui/host/vendor/gpui" }
