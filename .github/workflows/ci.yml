name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: core
      - run: go test -race ./...

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: drift
      - uses: actions/setup-go@v7
        with:
          go-version-file: drift/go.work
          cache-dependency-path: 'drift/**/go.sum'
      - uses: ./drift/.github/actions/setup-frontend
        with:
          neoworks-dev-token: ${{ secrets.NEOWORKS_DEV_TOKEN }}
      - name: Lint frontend
        working-directory: drift
        run: bun run lint:frontend
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: drift/apps/desktop
      - name: Test backend
        working-directory: drift/apps/desktop
        run: go test -race ./...
      - name: Build
        working-directory: drift
        run: bun run desktop:build
