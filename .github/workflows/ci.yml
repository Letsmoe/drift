name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: core
      - run: go test -race ./...

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: otter-music
      - uses: actions/setup-go@v7
        with:
          go-version-file: otter-music/go.work
          cache-dependency-path: 'otter-music/**/go.sum'
      - uses: ./otter-music/.github/actions/setup-frontend
        with:
          neoworks-dev-token: ${{ secrets.NEOWORKS_DEV_TOKEN }}
      - name: Lint frontend
        working-directory: otter-music
        run: bun run lint:frontend
      - name: Install Wails dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: otter-music/apps/desktop
          args: --build-tags webkit2_41
      - name: Build
        working-directory: otter-music
        run: bun run desktop:build
