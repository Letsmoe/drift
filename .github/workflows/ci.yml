name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: core
      - run: go test -race ./...

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: drift
      # The shell and the UI bundle build against svelte-gpui, which sits next to drift.
      - uses: actions/checkout@v7
        with:
          repository: neoworks-dev/svelte-gpui
          path: svelte-gpui
      - uses: actions/setup-go@v7
        with:
          go-version-file: drift/go.work
          cache-dependency-path: 'drift/**/go.sum'
      - uses: ./drift/.github/actions/setup-frontend
      - name: Install svelte-gpui's build dependencies
        working-directory: svelte-gpui
        run: bun install --frozen-lockfile
      # GPUI's windowing and text libraries, and GStreamer for the shell's audio.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libasound2-dev libfontconfig-dev libwayland-dev libx11-xcb-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev libssl-dev \
            libzstd-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: drift/apps/desktop/shell
      - name: Lint frontend
        working-directory: drift
        run: bun run lint:frontend
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: drift/apps/desktop
      - name: Test backend
        working-directory: drift/apps/desktop
        run: go test -race ./...
      - name: Build
        working-directory: drift
        run: bun run desktop:build
      - name: Lint shell
        working-directory: drift
        run: bun run lint:shell
