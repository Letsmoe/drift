name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach packages to, e.g. v0.0.1
        required: true

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            targets: AppImage tar.gz
            backend: drift-backend
          - os: macos-latest
            platform: mac
            targets: dmg zip
            backend: drift-backend
          - os: windows-latest
            platform: win
            targets: nsis zip
            backend: drift-backend.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: drift
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: drift/go.work
          cache-dependency-path: 'drift/**/go.sum'
      - uses: ./drift/.github/actions/setup-frontend
      - name: Check the tag matches the app version
        working-directory: drift/apps/desktop/electron
        run: |
          version=$(bun -e 'console.log(require("./package.json").version)')
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match version $version in apps/desktop/electron/package.json." >&2
            exit 1
          fi
      - name: Build frontend
        working-directory: drift/apps/desktop/frontend
        run: bun run build
      - name: Build backend
        working-directory: drift/apps/desktop
        run: go build -trimpath -ldflags='-s -w' -o build/bin/${{ matrix.backend }} .
      - name: Package
        working-directory: drift/apps/desktop/electron
        env:
          # Unsigned for now; don't pick up whatever identity the runner has.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          bun run build
          bun x electron-builder --${{ matrix.platform }} ${{ matrix.targets }} --publish never \
            '-c.artifactName=drift-${version}-${os}-${arch}.${ext}'
      - name: Attach to the release
        working-directory: drift/apps/desktop/build/electron
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          packages=(drift-*.AppImage drift-*.tar.gz drift-*.dmg drift-*.zip drift-*.exe)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "electron-builder produced no packages." >&2
            exit 1
          fi
          gh release upload "$TAG" "${packages[@]}" --clobber --repo "$GITHUB_REPOSITORY"
